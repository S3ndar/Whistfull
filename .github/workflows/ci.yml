name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      # --concurrency=1: the default (one worker per CPU) was observed to
      # intermittently duplicate or silently drop entire test files' results
      # under resource contention. Sequential is still fast for this suite
      # and guarantees every file's results are actually reported.
      - run: flutter test --concurrency=1
