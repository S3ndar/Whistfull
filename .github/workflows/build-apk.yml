name: Build APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # No android/key.properties in this repo (signing secrets are
      # gitignored, see CLAUDE.md) — android/app/build.gradle.kts falls
      # back to debug signing for the release build type when it's
      # absent, so this always produces an installable APK, just not
      # one signed for a Play upload.
      - run: flutter build apk --${{ inputs.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: whistly-${{ inputs.build_type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
