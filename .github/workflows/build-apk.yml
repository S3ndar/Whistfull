name: Build APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # No android/key.properties in this repo (signing secrets are
      # gitignored, see CLAUDE.md) — android/app/build.gradle.kts falls
      # back to debug signing for the release build type when it's
      # absent, so this always produces an installable APK, just not
      # one signed for a Play upload.
      - run: flutter build apk --${{ inputs.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: whistly-${{ inputs.build_type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
      # Uploads straight to Drive from this runner, which has normal
      # internet access — unlike a Claude Code cloud session, which
      # can't reach Drive's/Actions' artifact storage hosts and so
      # can't relay this file itself. Skipped entirely (not failed)
      # when the two secrets below aren't set yet, so this workflow
      # keeps working before that one-time setup is done.
      - name: Upload APK to Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_SA_KEY" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "GDRIVE_SA_KEY/GDRIVE_FOLDER_ID not set — skipping Drive upload."
            exit 0
          fi
          pip install --quiet google-api-python-client google-auth
          python3 - <<'PY'
          import datetime
          import json
          import os

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # `drive.file` (the minimal scope) only sees files the app
          # itself created or that were opened via a picker under that
          # scope — a folder merely shared with the service account
          # through the ordinary Share dialog doesn't qualify, and the
          # API then returns a bare 404 rather than a permission error.
          # `drive` (full scope) does respect folders shared by ACL.
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GDRIVE_SA_KEY"]),
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          drive = build("drive", "v3", credentials=creds)

          folder_id = os.environ["GDRIVE_FOLDER_ID"]
          # Confirms the folder is visible to this service account (and
          # is in fact a folder) before attempting the upload, so a bad
          # folder ID or missing share fails with a clear message
          # instead of the upload's own generic 404.
          folder = drive.files().get(
              fileId=folder_id, fields="id,name,mimeType", supportsAllDrives=True
          ).execute()
          if folder.get("mimeType") != "application/vnd.google-apps.folder":
              raise SystemExit(f"GDRIVE_FOLDER_ID ({folder_id}) is not a folder: {folder}")
          print(f"Target Drive folder confirmed: \"{folder['name']}\" ({folder_id})")

          build_type = "${{ inputs.build_type }}"
          run_number = "${{ github.run_number }}"
          timestamp = datetime.datetime.utcnow().strftime("%Y-%m-%d_%H%M")
          name = f"whistly-{build_type}-{timestamp}-run{run_number}.apk"

          metadata = {"name": name, "parents": [folder_id]}
          media = MediaFileUpload(
              f"build/app/outputs/flutter-apk/app-{build_type}.apk",
              mimetype="application/vnd.android.package-archive",
          )
          uploaded = drive.files().create(
              body=metadata, media_body=media, fields="id,webViewLink", supportsAllDrives=True
          ).execute()
          print(f"Uploaded to Drive: {uploaded['webViewLink']}")
          PY
