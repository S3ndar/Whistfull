name: whistly
description: "A score tracker for Colour Whist (Kleurenwiezen), with support for Trull, Solo, Abondance, Miserie and Rondpas multipliers."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+2

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5+1
  # 0.20.x: DateFormat (the only intl API used here) is unchanged; the
  # breaking changes were removals of deprecated locale helpers.
  intl: ^0.20.3
  confetti: ^0.8.0
  # 10.x requires Flutter >=3.41.6 / Dart >=3.11.0, and (from 9.0.0) Android
  # Gradle Plugin >=8.12.1 — see android/settings.gradle.kts, bumped to match.
  # PackageInfo.fromPlatform() and .version are unchanged.
  package_info_plus: ^10.2.1
  # 9.x needs Flutter >=3.38.1 / Dart >=3.10.0. The only break touching this
  # codebase is that AdSize.getCurrentOrientationAnchoredAdaptiveBannerAdSize()
  # is deprecated (not removed) in favour of the *Large* variants — those are a
  # taller ad slot, so switching is a layout/revenue decision, not a rename.
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  # PLAN.md B6: this pins analyzer 3.4.0, while the SDK this project builds
  # against is on the 3.13.0 language version — a mismatch `dart run
  # build_runner build` reports on every run ("Your current `analyzer`
  # version may not fully support your current SDK version"). It has stayed
  # workable so far (one real cost so far: `game_provider.dart` carries a
  # `// ignore: use_null_aware_elements` because that syntax doesn't parse
  # under 3.4.0's analyzer), but will resurface and may not stay workable at
  # the next SDK/hive_generator upgrade — check both together.
  # PINNED AND STUCK: hive_generator 2.0.1 (last published Aug 2023) requires
  # analyzer <7.0.0, which holds analyzer, build_runner, source_gen and
  # dart_style at old versions for the whole project. It only affects codegen,
  # never the shipped app. Escaping it means migrating to the community fork
  # (hive_ce + hive_ce_generator) and regenerating the adapters — worth doing,
  # but not before release.
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - assets/some_asset.png

  # B5 fix: this is a true variable font (wght axis 100-900, default 600).
  # A single asset entry is correct here — Flutter's per-entry `weight:` only
  # picks which *file* answers a request when several are declared; it does
  # not reach into a file and set its variable axis. The two-entry form this
  # used to have (both entries pointing at this same file, at weight: 600 and
  # weight: 800) therefore had every "800" request resolve to the identical
  # bytes as every "600" request, silently collapsing the two weights to one.
  # The actual 600/800 contrast now comes from `fontVariations:
  # [FontVariation('wght', ...)]` on each TextStyle in WhistlyText (see
  # theme/whistly_components.dart) rather than from font-file selection.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Config for flutter_launcher_icons (dev dependency). Regenerate with:
#   dart run flutter_launcher_icons
# ALTERATIONS.md (round 2) G — the three files below are the finished
# artwork (do not redraw/rescale/recentre them — see G2's own note on
# why the outer frame is gone and why 66%/78% are the scales that
# survive Android's circular mask without clipping the suits):
#   app_icon_adaptive_fg.png    — Android adaptive foreground, transparent,
#                                 mark at 66%, the centre cross bleeding to
#                                 the canvas edge.
#   app_icon_ios.png            — iOS + legacy Android, opaque cream
#                                 #F5F1EA, no alpha channel, mark at 78%.
#   app_icon_monochrome.png     — Android 13+ themed icon, single-colour
#                                 silhouette.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon_ios.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#F5F1EA"
  adaptive_icon_foreground: "assets/app_icon_adaptive_fg.png"
  adaptive_icon_monochrome: "assets/app_icon_monochrome.png"

# Config for flutter_native_splash (dev dependency). Regenerate with:
#   dart run flutter_native_splash:create
# `color_dark`/`image_dark` are the app's own ink #0E0E0E and the
# adaptive-foreground artwork — matching dark mode rather than
# inventing an eighth splash-only colour.
flutter_native_splash:
  color: "#F5F1EA"
  image: "assets/app_icon_ios.png"
  color_dark: "#0E0E0E"
  image_dark: "assets/app_icon_adaptive_fg.png"
  android_12:
    color: "#F5F1EA"
    color_dark: "#0E0E0E"
    image: "assets/app_icon_adaptive_fg.png"
    image_dark: "assets/app_icon_adaptive_fg.png"
